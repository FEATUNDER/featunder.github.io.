<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин Одежды</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Немного стилей, чтобы выглядело прилично */
        body { 
            font-family: Arial, sans-serif; 
            background-color: var(--tg-theme-bg-color, #fff); /* Адаптация под тему Телеграм */
            color: var(--tg-theme-text-color, #000);
            padding: 20px; 
            text-align: center;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            background: var(--tg-theme-secondary-bg-color, #f9f9f9);
        }
        img { max-width: 100%; border-radius: 10px; }
        select, button {
            padding: 10px;
            margin-top: 10px;
            width: 100%;
            border-radius: 5px;
            border: none;
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #fff);
            font-weight: bold;
            cursor: pointer;
        }
        .price { font-size: 1.2em; font-weight: bold; color: green; margin: 10px 0; }
    </style>
</head>
<body>

    <h1>Каталог</h1>

    <div class="card" id="product-1">
        <img src="https://via.placeholder.com/300x200?text=T-Shirt" alt="Футболка">
        <h3>Крутая Футболка</h3>
        <p>100% хлопок, стильная.</p>
        
        <select onchange="updatePrice(1, this.value)">
            <option value="S">Размер S</option>
            <option value="M">Размер M (+100 руб)</option>
            <option value="L">Размер L (+200 руб)</option>
        </select>

        <div class="price" id="price-1">1000 руб.</div>
        <button onclick="orderItem('Крутая Футболка', 1)">Хочу это!</button>
    </div>

    <script>
        // Инициализируем Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем приложение на весь экран

        // Базовые цены
        const basePrices = { 1: 1000 }; 
        // Текущие выбранные цены и размеры
        let currentSelection = { 
            1: { price: 1000, size: "S" } 
        };

        // Функция обновления цены при смене размера
        function updatePrice(id, size) {
            let price = basePrices[id];
            if (size === 'M') price += 100;
            if (size === 'L') price += 200;

            // Обновляем текст на экране
            document.getElementById(`price-${id}`).innerText = price + " руб.";
            
            // Запоминаем выбор
            currentSelection[id] = { price: price, size: size };
        }

        // Функция заказа (Самая важная!)
        function orderItem(name, id) {
            let itemData = {
                item: name,
                price: currentSelection[id].price,
                size: currentSelection[id].size
            };

            // Отправляем данные боту
            // tg.sendData превращает объект в строку и закрывает окно
            tg.sendData(JSON.stringify(itemData)); 
        }
    </script>
</body>
</html>
